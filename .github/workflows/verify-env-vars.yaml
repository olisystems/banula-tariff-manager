name: Verify Env Vars Sync

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify-dev-required-vars:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: olisystems/actions/helm/verify-required-values@main
        with:
          values-files: infra/helm/values.yaml,infra/helm/values.dev.yaml

  verify-dev-unused-vars:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: olisystems/actions/helm/verify-unused-values@main
        with:
          values-files: infra/helm/values.yaml,infra/helm/values.dev.yaml

  # tariff-manager's per-environment config lives in the external common-infra-resources
  # repo (ConfigMap manifests), not in infra/helm/values.dev.yaml/values.int.yaml/values.prod.yaml
  # (those files carry no `env:` overrides for this service), so the containment checks
  # compare the ConfigMap files there instead of the local values files.
  verify-int-in-dev:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Checkout common-infra-resources
        uses: actions/checkout@v4
        with:
          repository: olisystems/common-infra-resources
          path: common-infra-resources
      - uses: olisystems/actions/helm/verify-values-containment@main
        with:
          source-file: common-infra-resources/transit/dev/configmaps/tariff-manager-config.yaml
          target-file: common-infra-resources/transit/int/configmaps/tariff-manager-config.yaml
          env-key-path: .data

  verify-prod-in-dev:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Checkout common-infra-resources
        uses: actions/checkout@v4
        with:
          repository: olisystems/common-infra-resources
          path: common-infra-resources
      - uses: olisystems/actions/helm/verify-values-containment@main
        with:
          source-file: common-infra-resources/transit/dev/configmaps/tariff-manager-config.yaml
          target-file: common-infra-resources/transit/prod/configmaps/tariff-manager-config.yaml
          env-key-path: .data
