oli-app:
  fullnameOverride: "tariff-manager-prod"

  image:
    tag: "v0.1.0"

  resources:
    requests:
      cpu: 100m
      memory: 448Mi
    limits:
      cpu: 500m
      memory: 768Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
