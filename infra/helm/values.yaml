oli-app:
  restartPolicy: Always

  image:
    repository: "swr.eu-de.otc.t-systems.com/oli_banula/tariff-manager"
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets:
    - name: default-secret

  service:
    name: banula-tariff-manager-service
    type: ClusterIP
    port: 80
    containerPort: 8080

  env:
    SERVER_CONTEXT_PATH: "/tariff-manager"
    TARIFF_MANAGER_LOG_PAYLOAD: "true"
    PLATFORM_URL: "http://platform-deban-service"
    PLATFORM_PARTY_ID: "BAN"
    PLATFORM_COUNTRY_CODE: "DE"
    HASHING_SERVICE_URL: "https://hashing-api.de/api"

    ENVIRONMENT:
      configMapKeyRef:
        name: tariff-manager-config
        key: ENVIRONMENT
    SPRING_PROFILE:
      configMapKeyRef:
        name: tariff-manager-config
        key: SPRING_PROFILE
    TARIFF_MANAGER_URL:
      configMapKeyRef:
        name: tariff-manager-config
        key: TARIFF_MANAGER_URL

    MONGO_USER:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_user
    MONGO_PASSWORD:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_password
    MONGO_ENV:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_env
    MONGO_ADDRESS:
      secretKeyRef:
        name: mongodb-secret
        key: mongo_address
    # Settings for the OpenTelemetry Java agent. The agent loads only where
    # JDK_JAVA_OPTIONS attaches it (values.<env>.yaml).
    OTEL_SERVICE_NAME: "banula-tariff-manager"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc:4318"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "correlation_id,request_id,out_request_id,ocpi_from,ocpi_to"
    # Repository spans wrap each query 2-3 levels deep; the Mongo client spans already carry it.
    OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "false"

  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m

  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24

  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
