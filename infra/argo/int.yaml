apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tariff-manager-int
  namespace: argocd
  labels:
    repo: banula-tariff-manager
spec:
  project: banula
  source:
    repoURL: https://github.com/olisystems/banula-tariff-manager.git
    targetRevision: v1.2.0
    path: infra/helm
    helm:
      parameters:
        - name: oli-app.image.tag
          value: "v1.2.0"
      valueFiles:
        - values.yaml
        - values.int.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: banula-int
  syncPolicy:
    # Both fields are rewritten by tag.yaml on a published release, so a tag is
    # what deploys int. Prod takes the same tag but waits for a manual sync.
    automated: {}
    syncOptions:
      - CreateNamespace=true
